<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Assistant - JARVIS Style Chatbot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0b0b0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #003366, #1f1b2e, #0b0b0d);
        }

        .chat-container {
            width: 420px;
            background-color: rgba(0, 51, 102, 0.9);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #00aaff;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: #00aaff;
            text-shadow: 0 0 10px #00aaff, 0 0 20px #00aaff;
        }

        #chat-window {
            padding: 15px;
            height: 300px;
            overflow-y: scroll;
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
            background-color: rgba(0, 51, 102, 0.8);
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.2);
        }

        #output p {
            background-color: rgba(0, 153, 255, 0.2);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            max-width: 80%;
            word-wrap: break-word;
            color: #e0e0e0;
            transition: transform 0.3s ease-in-out;
        }

        #output p:hover {
            transform: scale(1.05);
            background-color: rgba(0, 153, 255, 0.4);
        }

        #userInput {
            width: 70%;
            padding: 12px;
            border: 2px solid #00aaff;
            outline: none;
            background-color: #1f1b2e;
            color: #e0e0e0;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.3);
        }

        #sendButton {
            width: 25%;
            padding: 12px;
            background-color: #00aaff;
            color: #fff;
            border: 2px solid #00aaff;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-size: 14px;
            border-radius: 8px;
        }

        #sendButton:hover {
            background-color: #0099cc;
            transform: scale(1.05);
        }

        #chat-window::-webkit-scrollbar {
            width: 10px;
        }

        #chat-window::-webkit-scrollbar-thumb {
            background-color: #00aaff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="logo">
            🤖 <!-- Symbol resembling a Tom Cruise robot -->
        </div>
        <div id="chat-window">
            <div id="output"></div>
            <div id="feedback"></div>
        </div>
        <input id="userInput" type="text" placeholder="Ask your Airline Assistant...">
        <button id="sendButton">Send</button>
    </div>
    <script>
        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            let userInput = document.getElementById('userInput').value;
            if (userInput.trim() !== "") {
                let outputDiv = document.getElementById('output');
                let userMessage = `<p><strong>You:</strong> ${userInput}</p>`;
                outputDiv.innerHTML += userMessage;
                document.getElementById('userInput').value = "";

                // Fetching response from ChatGPT API
                let botResponse = await fetchResponse(userInput);
                let botMessage = `<p><strong>Airline Assistant:</strong> ${botResponse}</p>`;
                outputDiv.innerHTML += botMessage;
                outputDiv.scrollTop = outputDiv.scrollHeight;  // Auto scroll to the bottom
            }
        }

        async function fetchResponse(userInput) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer YOUR_API_KEY`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4',
                        messages: [{ role: 'user', content: userInput }],
                        max_tokens: 150,
                        n: 1,
                        stop: null,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    return data.choices[0].message.content;
                } else {
                    console.error(data);
                    return "Sorry, I couldn't process your request.";
                }
            } catch (error) {
                console.error("Error fetching response:", error);
                return "Sorry, there was an error connecting to the server.";
            }
        }
    </script>
</body>
</html>
