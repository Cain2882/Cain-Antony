<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Assistant - Christmas Theme Chatbot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0b0b0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #e0e0e0;
            background-image: radial-gradient(circle at center, #ff0000, #006400, #0b0b0d); /* Christmas Red and Green */
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background-color: #4c1c24; /* Dark Red */
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.6); /* Green Glow */
            border-radius: 15px; /* Rounded corners */
            overflow: hidden;
            border: 5px solid #ff0000; /* Red Border */
            display: flex;
            flex-direction: column;
        }

        .logo {
            position: relative;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: #ff0000; /* Red */
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; /* Red Glow */
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #004d00; /* Green Background */
            border-bottom: 3px solid #ff0000; /* Red Border */
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.3); /* Green Inner Glow */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #output p {
            background-color: rgba(255, 0, 0, 0.2); /* Red message background */
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            max-width: 80%;
            word-wrap: break-word;
            color: #e0e0e0;
            transition: transform 0.3s ease-in-out;
        }

        #output p:hover {
            transform: scale(1.05);
            background-color: rgba(255, 0, 0, 0.4); /* Darker Red */
        }

        .input-container {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #4c1c24; /* Dark Red */
        }

        #userInput {
            width: 80%;
            padding: 12px;
            border: 2px solid #ff0000; /* Red Border */
            outline: none;
            background-color: #006400; /* Dark Green */
            color: #e0e0e0;
            font-size: 14px;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.3); /* Green Shadow */
        }

        #sendButton {
            width: 18%;
            padding: 12px;
            background-color: #ff0000; /* Red */
            color: #fff;
            border: 2px solid #ff0000; /* Red Border */
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-size: 14px;
            border-radius: 8px;
        }

        #sendButton:hover {
            background-color: #cc0000; /* Darker Red */
            transform: scale(1.05);
        }

        #chat-window::-webkit-scrollbar {
            width: 10px;
        }

        #chat-window::-webkit-scrollbar-thumb {
            background-color: #ff0000; /* Red Scrollbar */
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="logo">
            🤖 <!-- Symbol resembling Iron Man's face -->
        </div>
        <div id="chat-window">
            <div id="output"></div>
            <div id="feedback"></div>
        </div>
        <div class="input-container">
            <input id="userInput" type="text" placeholder="Ask your Airline Assistant...">
            <button id="sendButton">Send</button>
        </div>
    </div>
    <script>
        document.getElementById('sendButton').addEventListener('click', sendMessage);
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            let userInput = document.getElementById('userInput').value;
            if (userInput.trim() !== "") {
                let outputDiv = document.getElementById('output');
                let userMessage = `<p><strong>You:</strong> ${userInput}</p>`;
                outputDiv.innerHTML += userMessage;
                document.getElementById('userInput').value = "";

                // Fetching response from ChatGPT API
                let botResponse = await fetchResponse(userInput);
                let botMessage = `<p><strong>Airline Assistant:</strong> ${botResponse}</p>`;
                outputDiv.innerHTML += botMessage;
                outputDiv.scrollTop = outputDiv.scrollHeight;  // Auto scroll to the bottom
            }
        }

        async function fetchResponse(userInput) {
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer YOUR_API_KEY`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4',
                        messages: [{ role: 'user', content: userInput }],
                        max_tokens: 150,
                        n: 1,
                        stop: null,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    return data.choices[0].message.content;
                } else {
                    console.error(data);
                    return "Sorry, I couldn't process your request.";
                }
            } catch (error) {
                console.error("Error fetching response:", error);
                return "Sorry, there was an error connecting to the server.";
            }
        }
    </script>
</body>
</html>
